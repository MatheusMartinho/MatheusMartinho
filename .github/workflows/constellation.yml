name: constellation

on:
  schedule:
    # Contributions happen in other repos, which cannot trigger this workflow,
    # so poll: every two hours keeps the sky at most a couple of hours behind.
    - cron: "11 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/constellation.js"
      - ".github/workflows/constellation.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render assets/constellation.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: a fine-grained token with read access to the profile keeps private
          # contributions counted even if "include private contributions" is ever turned off
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT: assets/constellation.svg
        run: node .github/scripts/constellation.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constellation.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh constellation"
          git push
