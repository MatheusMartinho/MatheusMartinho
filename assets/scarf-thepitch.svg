<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-label="On the side: The Pitch, a stadium check-in app for football fans">
<defs>
  <pattern id="knit" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0,0 L3,4.5 L6,0" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="1.1"/>
    <path d="M0,3 L3,7.5 L6,3" fill="none" stroke="#FFF" stroke-opacity="0.07" stroke-width="0.8"/>
  </pattern>
  <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF" stop-opacity="0.14"/>
    <stop offset="45%" stop-color="#FFF" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.22"/>
  </linearGradient>
  <filter id="drop" x="-10%" y="-20%" width="120%" height="160%">
    <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <clipPath id="body"><rect x="26" y="30" width="308" height="62" rx="3"/></clipPath>
</defs>
<style>
  .wave { animation: wave 3.2s ease-in-out infinite; transform-origin: 180.0px 30px; }
  @keyframes wave { 0%, 100% { transform: skewY(-1.2deg) translateY(0); } 50% { transform: skewY(1.2deg) translateY(2px); } }
  .glint { animation: glint 5s ease-in-out infinite; }
  @keyframes glint { 0%, 70%, 100% { opacity: 1; } 80% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .wave, .glint { animation: none; } }
</style>
<g class="wave">
  <line x1="26" y1="33" x2="12" y2="32" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="38" x2="10" y2="39" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="43" x2="8" y2="42" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="48" x2="12" y2="49" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="53" x2="10" y2="52" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="58" x2="8" y2="59" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="63" x2="12" y2="62" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="68" x2="10" y2="69" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="73" x2="8" y2="72" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="78" x2="12" y2="79" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="83" x2="10" y2="82" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/><line x1="26" y1="88" x2="8" y2="89" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="334" y1="33" x2="348" y2="32" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="38" x2="350" y2="39" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="43" x2="352" y2="42" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="48" x2="348" y2="49" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="53" x2="350" y2="52" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="58" x2="352" y2="59" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="63" x2="348" y2="62" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="68" x2="350" y2="69" stroke="#E22D3F" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="73" x2="352" y2="72" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="78" x2="348" y2="79" stroke="#F6F1E7" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="83" x2="350" y2="82" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/><line x1="334" y1="88" x2="352" y2="89" stroke="#1B93B4" stroke-width="2.6" stroke-linecap="round"/>
  <g filter="url(#drop)"><rect x="26" y="30" width="308" height="62" rx="3" fill="#E22D3F"/></g>
  <g clip-path="url(#body)">
    <rect x="26" y="30" width="10" height="62" fill="#E22D3F"/><rect x="36" y="30" width="8" height="62" fill="#F6F1E7"/><rect x="44" y="30" width="12" height="62" fill="#1B93B4"/><rect x="56" y="30" width="8" height="62" fill="#F6F1E7"/><rect x="324" y="30" width="10" height="62" fill="#E22D3F"/><rect x="316" y="30" width="8" height="62" fill="#F6F1E7"/><rect x="304" y="30" width="12" height="62" fill="#1B93B4"/><rect x="296" y="30" width="8" height="62" fill="#F6F1E7"/>
