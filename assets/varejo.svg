    <stop offset="95%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.06"/>
  </linearGradient>
  <radialGradient id="glow" cx="22%" cy="10%" r="60%">
    <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.07"/><stop offset="100%" stop-color="#FFD98A" stop-opacity="0"/>
  </radialGradient>
  <filter id="drop" x="-20%" y="-10%" width="140%" height="130%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
  </filter>
</defs>
<style>
  .receipt { animation: print 2.8s cubic-bezier(.25,.8,.35,1) .4s both; }
  @keyframes print { from { transform: translateY(-409px); } to { transform: translateY(0); } }
  .right { animation: rise 1s ease-out .2s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .q { opacity: 0; animation: cycle 12s ease-in-out infinite; }
  .q1 { opacity: 1; animation-delay: 0s; }
  .q2 { animation-delay: 4s; }
  .q3 { animation-delay: 8s; }
  @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 30% { opacity: 1; } 33% { opacity: 0; } 100% { opacity: 0; } }
  .flow { animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .receipt, .right, .flow, .pulse { animation: none; }
    .q { animation: none; opacity: 0; }
    .q1 { opacity: 1; }
  }
</style>
<g clip-path="url(#frame)">
  <rect width="940" height="460" fill="#0D1117"/>
  <rect width="940" height="460" fill="url(#glow)"/>
</g>

