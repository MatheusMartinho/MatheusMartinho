  </linearGradient>
  <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E3B341"/><stop offset="55%" stop-color="#FFD98A"/><stop offset="100%" stop-color="#FFF1C9"/>
  </linearGradient>
